<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="755" viewBox="0 0 1080 755" role="img"><title>V58測定経路と継承された歩行計算</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#477583"/></marker></defs><rect width="1080" height="755" fill="#f5f9fa"/><text x="540" y="38" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="25" font-weight="bold" fill="#172936">同じソース内にある2つの経路</text><text x="270" y="80" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="bold" fill="#172936">V58で動く測定・観測</text><text x="810" y="80" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="bold" fill="#172936">継承コード：V58では歩行開始を拒否</text><rect x="35" y="106" width="470" height="92" rx="8" fill="#fff" stroke="#adc6ce"/><text x="270" y="137" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">IMU → バイアス補正 → 採用Madgwick</text><text x="270" y="163" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">姿勢・角速度を観測 / 通常β=0.025</text><rect x="575" y="106" width="470" height="92" rx="8" fill="#f0f2f3" stroke="#adc6ce"/><text x="810" y="137" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">動的βの検出角 + +gyの積分振幅</text><text x="810" y="163" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">ピークと中央通過を別々に判定</text><path d="M270 198 V226" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M810 198 V226" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="228" width="470" height="92" rx="8" fill="#fff" stroke="#adc6ce"/><text x="270" y="259" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">baseline → 速度準備 → 電流移行</text><text x="270" y="285" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">実初期速度・残留電流・Vbusを確認</text><rect x="575" y="228" width="470" height="92" rx="8" fill="#f0f2f3" stroke="#adc6ce"/><text x="810" y="259" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">自由減衰P1 + STEPポテンシャル</text><text x="810" y="285" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">次の無入力振幅と目標エネルギー</text><path d="M270 320 V348" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M810 320 V348" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="350" width="470" height="92" rx="8" fill="#fff" stroke="#adc6ce"/><text x="270" y="381" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">PROBE ±300 mA / COAST 0 mA</text><text x="270" y="407" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">公称60 ms、Q到達で幅を変えない</text><rect x="575" y="350" width="470" height="92" rx="8" fill="#f0f2f3" stroke="#adc6ce"/><text x="810" y="381" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">側別Q応答 + 積分補正</text><text x="810" y="407" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">幅0〜100 msを探索してQを選択</text><path d="M270 442 V470" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M810 442 V470" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="472" width="470" height="92" rx="8" fill="#fff" stroke="#adc6ce"/><text x="270" y="503" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">fresh current + 10〜50 ms速度trace</text><text x="270" y="529" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">期限・gap・通信・容量を監視</text><rect x="575" y="472" width="470" height="92" rx="8" fill="#f0f2f3" stroke="#adc6ce"/><text x="810" y="503" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">±300 mAパルス + 実測Q停止</text><text x="810" y="529" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">Q到達・未達期限・hard deadline</text><path d="M270 564 V592" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M810 564 V592" stroke="#477583" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="594" width="470" height="92" rx="8" fill="#fff" stroke="#adc6ce"/><text x="270" y="625" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">RWLOG → PC解析</text><text x="270" y="651" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">Q50、対応差引き・COAST回帰を比較</text><rect x="575" y="594" width="470" height="92" rx="8" fill="#f0f2f3" stroke="#adc6ce"/><text x="810" y="625" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">次のピークを実測して誤差を更新</text><text x="810" y="651" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="normal" fill="#172936">V7で成立した周期運動の制御系</text><text x="540" y="733" text-anchor="middle" font-family="Yu Gothic,Meiryo,sans-serif" font-size="17" font-weight="normal" fill="#172936">V58の結果で入力モデルを検討し、将来の歩行用派生版へ戻す。現時点では未接続。</text></svg>