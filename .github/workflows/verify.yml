name: Verify V58

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy matplotlib platformio

      - name: Run V58 production/software tests
        working-directory: firmware
        run: python -B tools/test_v58.py

      - name: Run V58 offline analysis test
        working-directory: firmware
        run: python -B tools/test_v58_offline.py

      - name: Build firmware
        working-directory: firmware
        run: pio run -e atoms3cam
